name: CI

# Two CI paths:
#
# * `ci` (default-features) — uses the OxideAV org-level reusable workflow,
#   which exercises the registry-integrated path (oxideav-core dep +
#   Decoder/Encoder trait impls).
# * `ci-standalone` (no-default-features) — inline job that builds and
#   tests the lib with `--no-default-features`, exercising the
#   `oxideav-core`-free standalone path. Catches regressions where
#   pipeline modules accidentally regrow an oxideav-core import.
# * `off-umbrella` — packages this crate like `cargo publish` does,
#   unpacks the `.crate` OUTSIDE the checkout and builds + tests a tiny
#   consumer against it with a small feature subset resolved from
#   crates.io (`tests/off_umbrella/run.sh`). Proves `build.rs` reads the
#   NORMALIZED manifest cargo ships and that `register_all` is populated
#   for a crates.io consumer — the published 0.0.2 was empty there.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    uses: OxideAV/.github/.github/workflows/crate-ci.yml@master
    secrets: inherit

  ci-standalone:
    name: Build & test (no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: standalone

      - name: Build (no-default-features)
        run: cargo build --no-default-features --lib --verbose

      - name: Test (no-default-features)
        run: cargo test --no-default-features --lib --test build_script_parser --verbose

  off-umbrella:
    name: Off-umbrella proof (packaged .crate + crates.io siblings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # No rust-cache: nothing is built inside the checkout (the .crate
      # is packaged with --no-verify and the consumer builds in
      # $RUNNER_TEMP); the consumer's four-crate build is small.

      # $RUNNER_TEMP is outside the checkout, so no workspace or
      # [patch.crates-io] of ours can reach the unpacked crate.
      - name: Package, unpack outside the checkout, build + test a consumer
        run: tests/off_umbrella/run.sh "$RUNNER_TEMP/off-umbrella"
