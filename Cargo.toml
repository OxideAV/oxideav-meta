[package]
name = "oxideav-meta"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-meta"
homepage = "https://github.com/OxideAV/oxideav-meta"
authors = ["Mark Karpeles"]
description = "Aggregator for oxideav — register_all(ctx) explicitly invokes every enabled sibling's register fn. Build-script auto-generates the call list from active feature flags. Audio/video/image/subtitle/hwaccel preset bundles. Replaces oxideav-format-all + the linkme distributed-slice approach (the latter had wasm caveats)."
readme = "README.md"
keywords = ["oxideav", "multimedia", "aggregator", "meta"]
categories = ["multimedia"]
build = "build.rs"

# Every sibling codec/container/filter/source is an optional cargo
# feature. Default-features = ["all"] pulls every sibling. Consumers
# opt down to a subset:
#
#   oxideav-format-all = { version = "*", default-features = false, features = ["image"] }
#
# Per-crate features let you slim further:
#
#   oxideav-format-all = { version = "*", default-features = false, features = ["png", "jpeg", "webp"] }
#
# When a feature is OFF, the sibling rlib isn't compiled and its
# linkme `oxideav_core::register!` entry doesn't reach the slice.
# `build.rs` honours the same feature gating when emitting `FORCE_LINK`.

[dependencies]
# oxideav-core is non-optional — the slice walker + register! macro live
# here. Every sibling depends on it transitively, but listing it
# explicitly makes the workspace patch redirect work cleanly.
oxideav-core = "0.1"

# All sibling codec/container/filter/source crates as optional deps.
# Audio codecs.
oxideav-aac = { version = "0.1", optional = true }
oxideav-ac3 = { version = "0.0", optional = true }
oxideav-ac4 = { version = "0.0", optional = true }
oxideav-adpcm = { version = "0.0", optional = true }
oxideav-celt = { version = "0.1", optional = true }
oxideav-flac = { version = "0.0", optional = true }
oxideav-g711 = { version = "0.0", optional = true }
oxideav-g722 = { version = "0.0", optional = true }
oxideav-g7231 = { version = "0.0", optional = true }
oxideav-g728 = { version = "0.0", optional = true }
oxideav-g729 = { version = "0.0", optional = true }
oxideav-gsm = { version = "0.0", optional = true }
oxideav-ilbc = { version = "0.0", optional = true }
oxideav-mp1 = { version = "0.0", optional = true }
oxideav-mp2 = { version = "0.0", optional = true }
oxideav-mp3 = { version = "0.1", optional = true }
oxideav-opus = { version = "0.0", optional = true }
oxideav-shorten = { version = "0.0", optional = true }
oxideav-speex = { version = "0.0", optional = true }
oxideav-vorbis = { version = "0.0", optional = true }

# Video codecs.
oxideav-amv = { version = "0.0", optional = true }
oxideav-av1 = { version = "0.1", optional = true }
oxideav-cinepak = { version = "0.0", optional = true }
oxideav-dirac = { version = "0.0", optional = true }
oxideav-ffv1 = { version = "0.0", optional = true }
oxideav-h261 = { version = "0.0", optional = true }
oxideav-h263 = { version = "0.0", optional = true }
oxideav-h264 = { version = "0.1", optional = true }
oxideav-h265 = { version = "0.0", optional = true }
oxideav-h266 = { version = "0.0", optional = true }
oxideav-huffyuv = { version = "0.0", optional = true }
oxideav-magicyuv = { version = "0.0", optional = true }
oxideav-mjpeg = { version = "0.1", optional = true }
oxideav-mpeg12video = { version = "0.0", optional = true }
oxideav-mpeg4video = { version = "0.1", optional = true }
oxideav-msmpeg4 = { version = "0.0", optional = true }
oxideav-prores = { version = "0.1", optional = true }
oxideav-theora = { version = "0.0", optional = true }
oxideav-utvideo = { version = "0.0", optional = true }
oxideav-vp6 = { version = "0.0", optional = true }
oxideav-vp8 = { version = "0.2", optional = true }
oxideav-vp9 = { version = "0.0", optional = true }

# Image codecs.
oxideav-avif = { version = "0.0", optional = true }
oxideav-dds = { version = "0.0", optional = true }
oxideav-gif = { version = "0.0", optional = true }
oxideav-icer = { version = "0.0", optional = true }
oxideav-jpeg2000 = { version = "0.0", optional = true }
oxideav-jpegxl = { version = "0.0", optional = true }
oxideav-jpegxs = { version = "0.0", optional = true }
oxideav-openexr = { version = "0.0", optional = true }
oxideav-pbm = { version = "0.0", optional = true }
oxideav-pdf = { version = "0.2", optional = true }
oxideav-pict = { version = "0.0", optional = true }
oxideav-png = { version = "0.1", optional = true }
oxideav-qoi = { version = "0.1", optional = true }
oxideav-svg = { version = "0.1", optional = true }
oxideav-webp = { version = "0.2", optional = true }

# Containers (audio/video/mixed).
oxideav-avi = { version = "0.0", optional = true }
oxideav-basic = { version = "0.0", optional = true }
oxideav-flv = { version = "0.0", optional = true }
oxideav-iff = { version = "0.0", optional = true }
oxideav-mkv = { version = "0.0", optional = true }
oxideav-mod = { version = "0.0", optional = true }
oxideav-mp4 = { version = "0.0", optional = true }
oxideav-ogg = { version = "0.1", optional = true }
oxideav-s3m = { version = "0.0", optional = true }

# Subtitle crates.
oxideav-ass = { version = "0.0", optional = true }
oxideav-sub-image = { version = "0.0", optional = true }
oxideav-subtitle = { version = "0.1", optional = true }

# Filter / generator / source crates.
oxideav-audio-filter = { version = "0.1", optional = true }
oxideav-generator = { version = "0.1", optional = true }
oxideav-http = { version = "0.0", optional = true }
oxideav-image-filter = { version = "0.1", optional = true }
oxideav-source = { version = "0.1", optional = true }
oxideav-bluray = { version = "0.0", optional = true }
oxideav-dvd = { version = "0.0", optional = true }
oxideav-mpegts = { version = "0.0", optional = true }

# Windows-codec delegation bridge. `oxideav-vfw` ships a `register`
# that, when invoked, walks the discovery path for `*.dll` / `*.ax`
# files and registers one `CodecInfo` per recognised FourCC into
# `ctx.codecs`. Pure-Rust at the host-CPU layer (the 32-bit x86
# emulator + PE loader run the Windows codec in-process). Not OS-gated
# — runs on any target Rust supports. Exposed as the standalone
# `vfw` feature; intentionally NOT part of any preset bundle so the
# filesystem scan stays opt-in.
oxideav-vfw = { version = "0.1", optional = true }

# 3D scenes / mesh / asset codecs. mesh3d carries the typed Scene3D
# model + Mesh3DRegistry; the four format crates (stl/obj/gltf/usdz)
# implement Mesh3DDecoder/Mesh3DEncoder and register into the
# Mesh3DRegistry. They use a SEPARATE dispatch contract from the
# codec/container/filter/source `register_all` path — see
# `populate_mesh3d_registry` in the generated module.
oxideav-mesh3d = { version = "0.0", optional = true }
oxideav-stl = { version = "0.0", optional = true }
oxideav-obj = { version = "0.0", optional = true }
oxideav-gltf = { version = "0.0", optional = true }
oxideav-usdz = { version = "0.0", optional = true }
oxideav-fbx = { version = "0.0", optional = true }

# 3D rasteriser / raycaster scaffold — consumes `Scene3D` from
# `oxideav-mesh3d` and emits packed RGBA8. Phase A ships the trait
# + factory contract only; later phases land the scanline backend
# (B) and pipeline source-node integration (C).
oxideav-render = { version = "0.0", optional = true }

# Hardware-accelerated codec crates — macOS-only (the crates are
# `#![cfg(target_os = "macos")]`). The corresponding `audiotoolbox` /
# `videotoolbox` features can be enabled on any target; the deps just
# resolve to nothing on non-mac so the feature becomes a no-op.
[target.'cfg(target_os = "macos")'.dependencies]
oxideav-audiotoolbox = { version = "0.0", optional = true }
oxideav-videotoolbox = { version = "0.0", optional = true }

# Hardware-accelerated codec crates — Linux-only (the crates are
# `#![cfg(target_os = "linux")]`). VA-API (Intel/AMD-leaning + the
# nvidia-vaapi-driver shim), VDPAU (NVIDIA + Mesa), and the NVIDIA
# NVDEC/NVENC bridge. Same target-no-op story: the feature is
# harmless to enable on non-linux.
[target.'cfg(target_os = "linux")'.dependencies]
oxideav-vaapi = { version = "0.0", optional = true }
oxideav-vdpau = { version = "0.0", optional = true }
oxideav-nvidia = { version = "0.0", optional = true }

# Vulkan Video — vendor- and OS-neutral. Builds on Linux + Windows
# (the crate body is gated to `cfg(any(target_os = "linux",
# target_os = "windows"))`). macOS would route through MoltenVK with
# a different loading story; out of scope for now.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
oxideav-vulkan-video = { version = "0.0", optional = true }

[features]
# Default pulls everything (every codec / container / filter / source).
# Disable with `default-features = false` and pick a subset.
default = ["all"]

# ---------------------------------------------------------------------
# Preset bundles — pull a coherent subset for a given media domain.
# ---------------------------------------------------------------------

# All sibling crates the framework knows about.
all = ["audio", "video", "image", "subtitles", "3d", "hwaccel", "source-drivers"]

# Every pure-Rust sibling — same as `all` minus the hardware-engine
# bridges (audiotoolbox, videotoolbox, vaapi, vdpau, nvidia,
# vulkan-video). Use this when you want a 100% pure-Rust build with
# zero FFI to OS HW-engine APIs (libloading'd or otherwise).
pure-rust = ["audio", "video", "image", "subtitles", "3d", "source-drivers"]

# Audio: codecs + audio-filter + the containers commonly carrying audio.
audio = [
    "aac", "ac3", "ac4", "adpcm", "celt", "flac",
    "g711", "g722", "g7231", "g728", "g729", "gsm", "ilbc",
    "mp1", "mp2", "mp3", "opus", "shorten", "speex", "vorbis",
    "audio-filter",
    "mkv", "mp4", "ogg", "iff", "amiga-mod", "s3m", "basic",
]

# Video: codecs + the containers commonly carrying video.
video = [
    "amv", "av1", "cinepak", "dirac", "ffv1",
    "h261", "h263", "h264", "h265", "h266",
    "huffyuv", "magicyuv",
    "mjpeg", "mpeg12video", "mpeg4video", "msmpeg4",
    "prores", "theora", "utvideo", "vp6", "vp8", "vp9",
    "mkv", "mp4", "avi", "flv", "mpegts",
]

# Image: still + animated image codecs + image-filter.
image = [
    "avif", "dds", "gif", "icer",
    "jpeg2000", "jpegxl", "jpegxs", "openexr",
    "pbm", "pdf", "pict", "png", "qoi", "svg", "webp",
    "image-filter",
]

# Subtitle codecs (preset name is plural to avoid clash with the
# per-crate `subtitle` feature for `oxideav-subtitle`).
subtitles = ["ass", "sub-image", "subtitle"]

# 3D scenes & assets: typed model (`oxideav-mesh3d`) + per-format codec
# crates that plug into `oxideav_mesh3d::Mesh3DRegistry` + the renderer
# that consumes `Scene3D`. Wire them up at runtime via
# `oxideav_meta::populate_mesh3d_registry(&mut reg)`. Preset name is `3d`
# so it doesn't collide with the per-crate `mesh3d` feature.
3d = ["mesh3d", "stl", "obj", "gltf", "usdz", "fbx", "render"]

# Hardware-accelerated codec crates. Each per-crate feature gates a
# sibling that's only built on the targets the crate body supports
# (mac for *toolbox, linux for vaapi/vdpau/nvidia, linux+windows for
# vulkan-video). Enabling the feature on an unsupported target is a
# no-op — the dep simply doesn't resolve.
hwaccel = [
    "audiotoolbox", "videotoolbox",
    "vaapi", "vdpau", "nvidia", "vulkan-video",
]

# I/O drivers — `source` is the file:// scheme handler; `http`
# adds `http(s)://`; `generator` adds `generate://` synth URIs;
# `bluray` adds `bluray://` (UDF mount + BDMV walk + .m2ts stream);
# `dvd` adds `dvd://` (ISO 9660 + UDF 1.02 mount + VIDEO_TS walk).
source-drivers = ["source", "http", "generator", "bluray", "dvd"]

# ---------------------------------------------------------------------
# Per-crate features — enable a single sibling without dragging a
# whole preset.
# ---------------------------------------------------------------------

# Audio codecs.
aac = ["dep:oxideav-aac"]
ac3 = ["dep:oxideav-ac3"]
ac4 = ["dep:oxideav-ac4"]
adpcm = ["dep:oxideav-adpcm"]
celt = ["dep:oxideav-celt"]
flac = ["dep:oxideav-flac"]
g711 = ["dep:oxideav-g711"]
g722 = ["dep:oxideav-g722"]
g7231 = ["dep:oxideav-g7231"]
g728 = ["dep:oxideav-g728"]
g729 = ["dep:oxideav-g729"]
gsm = ["dep:oxideav-gsm"]
ilbc = ["dep:oxideav-ilbc"]
mp1 = ["dep:oxideav-mp1"]
mp2 = ["dep:oxideav-mp2"]
mp3 = ["dep:oxideav-mp3"]
opus = ["dep:oxideav-opus"]
shorten = ["dep:oxideav-shorten"]
speex = ["dep:oxideav-speex"]
vorbis = ["dep:oxideav-vorbis"]

# Video codecs.
amv = ["dep:oxideav-amv"]
av1 = ["dep:oxideav-av1"]
cinepak = ["dep:oxideav-cinepak"]
dirac = ["dep:oxideav-dirac"]
ffv1 = ["dep:oxideav-ffv1"]
h261 = ["dep:oxideav-h261"]
h263 = ["dep:oxideav-h263"]
h264 = ["dep:oxideav-h264"]
h265 = ["dep:oxideav-h265"]
h266 = ["dep:oxideav-h266"]
huffyuv = ["dep:oxideav-huffyuv"]
magicyuv = ["dep:oxideav-magicyuv"]
mjpeg = ["dep:oxideav-mjpeg"]
mpeg12video = ["dep:oxideav-mpeg12video"]
mpeg4video = ["dep:oxideav-mpeg4video"]
msmpeg4 = ["dep:oxideav-msmpeg4"]
prores = ["dep:oxideav-prores"]
theora = ["dep:oxideav-theora"]
utvideo = ["dep:oxideav-utvideo"]
vp6 = ["dep:oxideav-vp6"]
vp8 = ["dep:oxideav-vp8"]
vp9 = ["dep:oxideav-vp9"]

# Image codecs.
avif = ["dep:oxideav-avif"]
dds = ["dep:oxideav-dds"]
gif = ["dep:oxideav-gif"]
icer = ["dep:oxideav-icer"]
jpeg2000 = ["dep:oxideav-jpeg2000"]
jpegxl = ["dep:oxideav-jpegxl"]
jpegxs = ["dep:oxideav-jpegxs"]
openexr = ["dep:oxideav-openexr"]
pbm = ["dep:oxideav-pbm"]
pdf = ["dep:oxideav-pdf"]
pict = ["dep:oxideav-pict"]
png = ["dep:oxideav-png"]
qoi = ["dep:oxideav-qoi"]
svg = ["dep:oxideav-svg"]
webp = ["dep:oxideav-webp"]

# Containers.
avi = ["dep:oxideav-avi"]
basic = ["dep:oxideav-basic"]
flv = ["dep:oxideav-flv"]
iff = ["dep:oxideav-iff"]
mkv = ["dep:oxideav-mkv"]
amiga-mod = ["dep:oxideav-mod"]
mp4 = ["dep:oxideav-mp4"]
ogg = ["dep:oxideav-ogg"]
s3m = ["dep:oxideav-s3m"]

# Subtitle.
ass = ["dep:oxideav-ass"]
sub-image = ["dep:oxideav-sub-image"]
subtitle = ["dep:oxideav-subtitle"]

# Filter / source.
audio-filter = ["dep:oxideav-audio-filter"]
bluray = ["dep:oxideav-bluray", "mpegts"]
# `mpegts` adds the MPEG-TS Demuxer (PAT/PMT/PES) under
# `ContainerRegistry`. Pulled in transitively by `bluray` so the
# `bluray://` chapter-segment bytes can demux through the registry
# instead of needing a direct CLI-level dep.
mpegts = ["dep:oxideav-mpegts"]
# `dvd` adds the `dvd://` source driver (ISO 9660 + UDF 1.02 mount +
# VIDEO_TS walk). Folded into the `source-drivers` preset alongside
# `bluray` so consumers asking for the broader I/O surface get both.
dvd = ["dep:oxideav-dvd"]
generator = ["dep:oxideav-generator"]
http = ["dep:oxideav-http"]
image-filter = ["dep:oxideav-image-filter"]
source = ["dep:oxideav-source"]

# Windows-codec delegation bridge — opt-in. The sibling's `register`
# walks the discovery path (`OXIDEAV_VFW_CODEC_PATH` or
# `~/.local/share/oxideav/codecs/`) and probes each `*.dll` / `*.ax`,
# registering one `CodecInfo` per recognised FourCC into
# `ctx.codecs`. Intentionally NOT in any preset bundle so the
# filesystem scan + cache lookup at registration time stays explicit;
# enable with `features = ["vfw"]` when you want the bridge.
vfw = ["dep:oxideav-vfw"]

# Hardware accel (per-crate body has its own target gate; feature is
# target-portable — enabling on an unsupported target is a no-op).
audiotoolbox = ["dep:oxideav-audiotoolbox"]
videotoolbox = ["dep:oxideav-videotoolbox"]
vaapi = ["dep:oxideav-vaapi"]
vdpau = ["dep:oxideav-vdpau"]
nvidia = ["dep:oxideav-nvidia"]
vulkan-video = ["dep:oxideav-vulkan-video"]

# 3D scenes / mesh / asset codecs. The four format crates each pull
# `mesh3d` so `oxideav_mesh3d::Mesh3DRegistry` is always reachable
# whenever any 3D format is enabled.
mesh3d = ["dep:oxideav-mesh3d"]
stl = ["dep:oxideav-stl", "mesh3d"]
obj = ["dep:oxideav-obj", "mesh3d"]
gltf = ["dep:oxideav-gltf", "mesh3d"]
usdz = ["dep:oxideav-usdz", "mesh3d"]
fbx = ["dep:oxideav-fbx", "mesh3d"]

# 3D renderer (Scene3D → packed RGBA8). Pulls `mesh3d` because the
# render trait takes `&Scene3D` as input.
render = ["dep:oxideav-render", "mesh3d"]
